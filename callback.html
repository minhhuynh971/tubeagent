<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TubeAgent – Connecting</title><style>body{font:16px/1.6 -apple-system,system-ui,sans-serif;max-width:720px;margin:40px auto;padding:0 16px;color:#1a1a2e;background:#fff}h1{color:#3a1a6e}</style></head><body>
<h1>Connecting your TikTok account…</h1><p id="s">Please wait.</p>
<script>
const p=new URLSearchParams(location.search),s=document.getElementById("s");
if(p.get("error")){s.textContent="Login cancelled: "+(p.get("error_description")||p.get("error"))}
else if(p.get("code")){
  fetch("http://localhost:8765/exchange",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({code:p.get("code"),state:p.get("state")})}).then(r=>r.json()).then(r=>{
    if(r.ok){s.textContent="Connected! Redirecting…";location.replace("post.html")}
    else s.textContent="Error: "+JSON.stringify(r.error)}).catch(()=>{s.textContent="Local helper not running. Start tubeagent/tiktok_app.py and log in again."})
}else s.textContent="Nothing to do here."
</script>
